name: Deploy EBG Studio to Cloudflare Pages

on:
  push:
    branches: [feat/ebg-studio-app]
    paths:
      - "studio/**"
      - "src/lib/**"
      - "src/components/MusicPlayer.tsx"
      - ".github/workflows/deploy-studio-cloudflare.yml"
      - "scripts/configure-streaming-pages.mjs"
      - "scripts/verify-streaming-deployment.mjs"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  VITE_STUDIO_LYRICS_URL: ${{ vars.VITE_STUDIO_LYRICS_URL || 'https://ebg-studio-lyrics.roosevelt-wooden.workers.dev' }}
  STUDIO_PROJECT_NAME: ebg-studio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Configure streaming Pages build
        run: node scripts/configure-streaming-pages.mjs

      - name: Build standalone Studio
        run: npm run studio:build

      - name: Deploy Studio
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-studio --project-name=ebg-studio --branch=feat/ebg-studio-app --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published streaming assets
        run: node scripts/verify-streaming-deployment.mjs
