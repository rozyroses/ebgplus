name: Deploy EBG Studio to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  STUDIO_PROJECT_NAME: ebg-studio

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Build standalone Studio
        run: npm run studio:build

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        run: |
          PROJECTS="$(npx --yes wrangler@latest pages project list --json)"
          if ! printf '%s' "$PROJECTS" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const x=JSON.parse(s);process.exit(x.some(p=>p.name===process.env.STUDIO_PROJECT_NAME)?0:1)})"; then
            npx --yes wrangler@latest pages project create "$STUDIO_PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy Studio
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-studio --project-name=ebg-studio --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
