name: Deploy EBG+ with Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Supabase auth integration
        run: node scripts/apply-auth-integration.mjs
      - name: Apply Supabase user-data integration
        run: node scripts/apply-userdata-integration.mjs
      - name: Remove legacy auth leftovers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/App.tsx')
          text = path.read_text()
          text = re.sub(r"const hashPassword = async \(email: string, password: string\) => \{.*?\n\}\n\n(?=const createStarterProfile)", "", text, flags=re.S)
          text = text.replace("  const [authState, setAuthState] = useState<AuthState | null>(null)\n", "")
          text = re.sub(r"\n\s*setAuthState\([^\n]+\)", "", text)
          path.write_text(text)
          PY
      - name: Configure router for project Pages path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          text = text.replace('<BrowserRouter>', '<BrowserRouter basename={import.meta.env.BASE_URL}>', 1)
          path.write_text(text)
          PY
      - name: Verify Supabase variables
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Build
        run: npm run build -- --base=/ebgplus/
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
