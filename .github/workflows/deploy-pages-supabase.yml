name: Deploy EBG+ with Supabase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Supabase auth integration
        run: node scripts/apply-auth-integration.mjs
      - name: Apply Supabase user-data integration
        run: node scripts/apply-userdata-integration.mjs
      - name: Apply Phase 1.6 Studio integration
        run: node scripts/apply-phase16-studio.mjs
      - name: Apply Phase 1.7 UI/media integration
        run: node scripts/apply-phase17-ui-media.mjs
      - name: Apply Phase 1.8 homepage/Studio integration
        run: node scripts/apply-phase18-homepage-studio.mjs
      - name: Apply Phase 1.8 build cleanup
        run: node scripts/apply-phase18-buildfix.mjs
      - name: Apply Phase 1.9 Coming Soon waitlist
        run: node scripts/apply-phase19-coming-soon.mjs
      - name: Apply Phase 1.10 Coming Soon polish
        run: node scripts/apply-phase110-coming-soon-polish.mjs
      - name: Apply Phase 1.11 Heartspell House foundation
        run: node scripts/apply-phase111-heartspell.mjs
      - name: Apply Phase 1.11 build fix
        run: node scripts/apply-phase111-buildfix.mjs
      - name: Prepare Phase 1.12 integration
        run: node scripts/prepare-phase112.mjs
      - name: Apply Phase 1.12 universal Studio, polls, and forms
        run: node scripts/apply-phase112-studio-polls-forms.mjs
      - name: Redirect EBG Forms to custom domain
        run: node scripts/apply-forms-domain-redirect.mjs
      - name: Apply Phase 1.13 My Applications tracker
        run: node scripts/apply-phase113-my-applications.mjs
      - name: Apply Phase 1.14 real footer pages
        run: node scripts/apply-phase114-footer-pages.mjs
      - name: Apply Phase 1.15 cinematic homepage refresh
        run: node scripts/apply-phase115-homepage-refresh.mjs
      - name: Apply Phase 1.16 premium auth experience
        run: node scripts/apply-phase116-auth-experience.mjs
      - name: Apply universal transparent branding
        run: node scripts/apply-universal-branding.mjs
      - name: Apply Phase 1.17 Studio workspace polish
        run: node scripts/apply-phase117-studio-polish.mjs
      - name: Apply Phase 1.18 Studio replace media controls
        run: node scripts/apply-phase118-replace-media-controls.mjs
      - name: Apply Phase 1.19 media delete and hero fit controls
        run: node scripts/apply-phase119-media-delete-hero-fit.mjs
      - name: Apply Phase 1.20 hero logo layout
        run: node scripts/apply-phase120-hero-logo-layout.mjs
      - name: Apply Phase 1.21 Shows browse layout
        run: node scripts/apply-phase121-shows-grid.mjs
      - name: Apply Phase 1.22 Notifications 2.0
        run: node scripts/apply-phase122-notifications2.mjs
      - name: Apply Phase 1.22 build cleanup
        run: node scripts/apply-phase122-buildfix.mjs
      - name: Apply Phase 1.23 automatic casting alerts
        run: node scripts/apply-phase123-casting-status-alerts.mjs
      - name: Apply Phase 1.24 reference-style homepage hero
        run: node scripts/apply-phase124-reference-hero.mjs
      - name: Apply Phase 1.25 episode publishing controls
        run: node scripts/apply-phase125-episode-publishing.mjs
      - name: Apply Phase 1.26 homepage hero/media cleanup
        run: node scripts/apply-phase126-home-hero-media-cleanup.mjs
      - name: Apply Phase 1.27 homepage hero polish
        run: node scripts/apply-phase127-studio-flow-home-hero.mjs
      - name: Apply Phase 1.28 routed Studio pages
        run: node scripts/apply-phase128-studio-pages.mjs
      - name: Apply Phase 1.29 Studio workspace flow
        run: node scripts/apply-phase129-studio-workspace-flow.mjs
      - name: Apply Phase 1.30 combined Production Workspace
        run: node scripts/apply-phase130-production-workspace.mjs
      - name: Apply Phase 1.31 Studio visual redesign
        run: node scripts/apply-phase131-studio-visual-redesign.mjs
      - name: Apply Phase 1.32 EBG Studio 2.0
        run: node scripts/apply-phase132-studio2.mjs
      - name: Apply Phase 1.33 Management cleanup
        run: node scripts/apply-phase133-management-cleanup.mjs
      - name: Apply Phase 1.34 Studio syntax rebuild
        run: node scripts/apply-phase134-studio-syntax-rebuild.mjs
      - name: Apply Phase 1.35 Studio render fix
        run: node scripts/apply-phase135-studio-render-fix.mjs
      - name: Apply Phase 1.36 complete Studio migration
        run: node scripts/apply-phase136-studio-complete.mjs
      - name: Apply Phase 1.37 Studio build cleanup
        run: node scripts/apply-phase137-studio-buildfix.mjs
      - name: Apply Phase 1.38 Studio cleanup and homepage carousel
        run: node scripts/apply-phase138-studio-home-carousel.mjs
      - name: Safeguard Library menu links
        run: node scripts/apply-library-links-safeguard.mjs
      - name: Remove legacy auth leftovers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/App.tsx')
          text = path.read_text()
          text = re.sub(r"const hashPassword = async \(email: string, password: string\) => \{.*?\n\}\n\n(?=const createStarterProfile)", "", text, flags=re.S)
          text = text.replace("  const [authState, setAuthState] = useState<AuthState | null>(null)\n", "")
          text = re.sub(r"\n\s*setAuthState\([^\n]+\)", "", text)
          path.write_text(text)
          PY
      - name: Configure router for custom domain
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          text = text.replace('<BrowserRouter>', '<BrowserRouter basename={import.meta.env.BASE_URL}>', 1)
          path.write_text(text)
          PY
      - name: Lock transparent favicon
        run: node scripts/apply-favicon-safeguard.mjs
      - name: Verify Supabase variables
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Build
        run: npm run build -- --base=/
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4