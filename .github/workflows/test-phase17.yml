name: Test EBG+ Phase 1.10

on:
  push:
    branches: ['feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Supabase auth integration
        run: node scripts/apply-auth-integration.mjs
      - name: Apply Supabase user data integration
        run: node scripts/apply-userdata-integration.mjs
      - name: Apply Phase 1.6 Studio integration
        run: node scripts/apply-phase16-studio.mjs
      - name: Apply Phase 1.7 UI/media integration
        run: node scripts/apply-phase17-ui-media.mjs
      - name: Apply Phase 1.8 homepage/Studio integration
        run: node scripts/apply-phase18-homepage-studio.mjs
      - name: Apply Phase 1.8 build cleanup
        run: node scripts/apply-phase18-buildfix.mjs
      - name: Apply Phase 1.9 Coming Soon waitlist
        run: node scripts/apply-phase19-coming-soon.mjs
      - name: Apply Phase 1.10 Coming Soon polish
        run: node scripts/apply-phase110-coming-soon-polish.mjs
      - name: Remove legacy auth leftovers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/App.tsx')
          text = path.read_text()
          text = re.sub(r"const hashPassword = async \(email: string, password: string\) => \{.*?\n\}\n\n(?=const createStarterProfile)", "", text, flags=re.S)
          text = text.replace("  const [authState, setAuthState] = useState<AuthState | null>(null)\n", "")
          text = re.sub(r"\n\s*setAuthState\([^\n]+\)", "", text)
          path.write_text(text)
          PY
      - name: Configure Pages base path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text().replace('<BrowserRouter>', '<BrowserRouter basename={import.meta.env.BASE_URL}>', 1)
          path.write_text(text)
          PY
      - name: Verify Supabase variables
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"
      - name: Build
        run: npm run build -- --base=/
